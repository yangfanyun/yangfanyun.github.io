<style>
  .error-particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: float-error 8s ease-in-out infinite;
  }

  @keyframes float-error {
    0%, 100% {
      transform: translateY(0) rotate(0deg);
      opacity: 0.3;
    }
    25% {
      transform: translateY(-30px) rotate(90deg);
      opacity: 0.6;
    }
    50% {
      transform: translateY(-10px) rotate(180deg);
      opacity: 0.4;
    }
    75% {
      transform: translateY(-40px) rotate(270deg);
      opacity: 0.7;
    }
  }

  .error-particle:nth-child(1) {
    width: 300px;
    height: 300px;
    top: -100px;
    left: -100px;
    background: radial-gradient(circle, rgba(51, 112, 255, 0.2) 0%, transparent 70%);
    animation-delay: 0s;
  }

  .error-particle:nth-child(2) {
    width: 200px;
    height: 200px;
    bottom: -50px;
    right: -50px;
    background: radial-gradient(circle, rgba(11, 201, 157, 0.15) 0%, transparent 70%);
    animation-delay: -3s;
  }

  .error-particle:nth-child(3) {
    width: 150px;
    height: 150px;
    top: 50%;
    left: 60%;
    background: radial-gradient(circle, rgba(89, 148, 255, 0.1) 0%, transparent 70%);
    animation-delay: -5s;
  }

  .error-particle:nth-child(4) {
    width: 100px;
    height: 100px;
    bottom: 20%;
    left: 10%;
    background: radial-gradient(circle, rgba(11, 201, 157, 0.1) 0%, transparent 70%);
    animation-delay: -2s;
  }

  .error-404-text {
    font-size: clamp(6rem, 20vw, 12rem);
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(135deg, #3370ff 0%, #0bc99d 50%, #3370ff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient-shift 4s ease-in-out infinite;
    filter: drop-shadow(0 0 40px rgba(51, 112, 255, 0.3));
  }

  @keyframes gradient-shift {
    0%, 100% {
      background-position: 0% 50%;
    }
    50% {
      background-position: 100% 50%;
    }
  }

  .glitch-container {
    position: relative;
    display: inline-block;
  }

  .glitch-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #3370ff 0%, #0bc99d 50%, #3370ff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient-shift 4s ease-in-out infinite;
    opacity: 0.7;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
</style>
