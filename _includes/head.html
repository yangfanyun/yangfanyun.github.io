<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="theme-color" content="#0a1628">

    {%- seo -%}

    {%- if page.keywords -%}
    <meta name="keywords" content="{{ page.keywords }}">
    {%- endif -%}

    <link rel="canonical" href="{{ page.url | absolute_url }}">

    {%- feed_meta -%}

    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">

    <!-- Google Fonts: Noto Sans SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (预编译) -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>

    {%- if page.custom_css -%}
        <link rel="stylesheet" href="{{ page.custom_css | relative_url }}">
    {%- endif -%}

    <!-- JSON-LD Breadcrumb -->
    {%- if page.breadcrumb -%}
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            {"@type": "ListItem", "position": 1, "name": "首页", "item": "{{ '/' | absolute_url }}"}
            {%- for crumb in page.breadcrumb -%}
            ,{"@type": "ListItem", "position": {{ forloop.index | plus: 1 }}, "name": "{{ crumb.name }}", "item": "{{ crumb.url | absolute_url }}"}
            {%- endfor -%}
        ]
    }
    </script>
    {%- endif -%}

    <!-- JSON-LD Site Search -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "{{ '/' | absolute_url }}",
        "potentialAction": {
            "@type": "SearchAction",
            "target": {
                "@type": "EntryPoint",
                "urlTemplate": "{{ '/?s=' | absolute_url }}{search_term_string}"
            },
            "query-input": "required name=search_term_string"
        }
    }
    </script>
 <!-- ==================== 弹窗开始 ==================== -->

<style>
#popupOverlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    z-index: 999999;
    padding: 15px;
    box-sizing: border-box;
}

#popupOverlay.show {
    display: flex;
}

.popup-content {
    width: 380px;
    max-width: 100%;
    background: #ffffff;
    border-radius: 18px;
    padding: 25px 20px 20px;
    position: relative;
    text-align: center;
    box-sizing: border-box;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    animation: popupShow 0.35s ease;
    max-height: 90vh;
    overflow-y: auto;
}

@keyframes popupShow {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.popup-close-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: #f3f4f6;
    color: #888;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    z-index: 10;
    transition: all 0.25s ease;
}

.popup-close-btn:hover {
    background: #ef4444;
    color: #fff;
}

.popup-link {
    display: block;
    text-decoration: none;
    color: inherit;
}

.popup-title {
    margin: 0 0 10px;
    font-size: 24px;
    line-height: 1.4;
    font-weight: 800;
    color: #ef4444;
}

.popup-desc {
    margin: 0 0 15px;
    font-size: 14px;
    line-height: 1.6;
    color: #666;
}

.popup-image {
    width: 100%;
    max-width: 320px;
    height: auto;
    display: block;
    margin: 0 auto 18px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
}

.popup-shop-box {
    border-top: 1px solid #eeeeee;
    padding-top: 18px;
    margin-top: 5px;
}

.popup-shop-btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: linear-gradient(135deg, #ff416c, #e11d48);
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.5;
    padding: 14px 10px;
    border-radius: 10px;
    text-decoration: none;
    box-shadow: 0 6px 15px rgba(225, 29, 72, 0.3);
    transition: all 0.25s ease;
}

.popup-shop-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(225, 29, 72, 0.4);
}

@media (max-width: 480px) {

    #popupOverlay {
        padding: 12px;
    }

    .popup-content {
        width: 95%;
        padding: 22px 15px 18px;
        border-radius: 16px;
    }

    .popup-title {
        font-size: 21px;
    }

    .popup-desc {
        font-size: 13px;
    }

    .popup-shop-btn {
        font-size: 15px;
        padding: 13px 8px;
    }

    .popup-close-btn {
        width: 30px;
        height: 30px;
        font-size: 20px;
    }
}
</style>
</head>
<body class="bg-white dark:bg-[#0a1628] text-gray-900 dark:text-gray-100 font-sans antialiased transition-colors duration-300" x-data="{ darkMode: localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches) }" x-init="$watch('darkMode', val => { document.documentElement.classList.toggle('dark', val); localStorage.setItem('theme', val ? 'dark' : 'light') })" :class="{ 'dark': darkMode }">
